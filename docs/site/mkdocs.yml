site_name: Rayito
site_url: https://alejandro-cedeno-10.github.io/rayito/
site_description: Sandboxes de ejecución para agentes de IA sobre AWS Lambda MicroVMs, en tu propia cuenta.
docs_dir: docs
site_dir: _build
repo_url: https://github.com/alejandro-cedeno-10/rayito
repo_name: alejandro-cedeno-10/rayito
edit_uri: edit/main/docs/site/docs/
strict: true
# El GIF sólo lo usa el README del repositorio: el sitio sirve el vídeo.
exclude_docs: |
  assets/rayito/rayito-readme-960.gif
copyright: >-
  Copyright 2026 Rayito contributors ·
  <a href="https://github.com/alejandro-cedeno-10/rayito/blob/main/LICENSE">Apache-2.0</a> ·
  <a href="https://github.com/alejandro-cedeno-10/rayito/blob/main/CONTRIBUTING.md">Contribuir</a> ·
  <a href="https://github.com/alejandro-cedeno-10/rayito/blob/main/SECURITY.md">Seguridad</a> ·
  <a href="https://github.com/alejandro-cedeno-10/rayito/blob/main/CODE_OF_CONDUCT.md">Código de conducta</a><br>
  Proyecto independiente, no afiliado, patrocinado ni respaldado por E2B ni por AWS;
  sus nombres se usan sólo para describir compatibilidad y plataforma.

# MkDocs 1.6: con `strict`, un enlace o un ancla rota rompe el build.
validation:
  omitted_files: warn
  absolute_links: relative_to_docs
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: es
  custom_dir: overrides
  logo: assets/rayito-bolt.svg
  favicon: assets/rayito-bolt.svg
  font:
    text: Atkinson Hyperlegible Next
    code: JetBrains Mono
  features:
    # Sin navigation.instant: con él el selector de idioma no cambia a la
    # misma página en el otro idioma (aviso de mkdocs-static-i18n).
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Modo claro

extra_css:
  - stylesheets/rayito.css

extra_javascript:
  - javascripts/rayito-art.js

hooks:
  - hooks/limits_macros.py

plugins:
  - search
  # Sitio bilingüe: `pagina.md` es español (por defecto, URLs sin cambio) y
  # `pagina.en.md` es inglés, bajo /en/. Una página sin traducción se sirve en
  # español también en /en/ (`fallback_to_default`); `scripts/check_docs_i18n.py`
  # exige la pareja de cada página. `reconfigure_search` declara los dos
  # idiomas del buscador, pero el índice (`search/search_index.json`) es uno
  # solo y lo comparten /es y /en: una consulta devuelve también la misma
  # página en el otro idioma (Material no filtra por idioma; límite conocido
  # de mkdocs-static-i18n). El selector sale de `reconfigure_material`.
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: es
          name: Español
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: Rayito
          site_description: Execution sandboxes for AI agents on AWS Lambda MicroVMs, in your own account.
          copyright: >-
            Copyright 2026 Rayito contributors ·
            <a href="https://github.com/alejandro-cedeno-10/rayito/blob/main/LICENSE">Apache-2.0</a> ·
            <a href="https://github.com/alejandro-cedeno-10/rayito/blob/main/CONTRIBUTING.md">Contributing</a> ·
            <a href="https://github.com/alejandro-cedeno-10/rayito/blob/main/SECURITY.md">Security</a> ·
            <a href="https://github.com/alejandro-cedeno-10/rayito/blob/main/CODE_OF_CONDUCT.md">Code of conduct</a><br>
            Independent project, not affiliated with, sponsored or endorsed by E2B or AWS;
            their names are used only to describe compatibility and platform.
          theme:
            palette:
              - toggle:
                  name: Dark mode
              - toggle:
                  name: Light mode
          nav_translations:
            Inicio: Home
            Primeros pasos: Getting started
            Instalación: Installation
            Configurar AWS: Set up AWS
            Primer sandbox: First sandbox
            Conceptos: Concepts
            Guías: Guides
            Sandbox: Sandbox
            Ciclo de vida: Lifecycle
            Pausar y reanudar: Pause and resume
            Plazo del servidor: Server-side deadline
            Pool: Pool
            Persistencia: Persistence
            Async: Async
            Ejecutar: Run
            Comandos: Commands
            Ejecutar código: Run code
            Lenguajes y kernels: Languages and kernels
            Terminal (PTY): Terminal (PTY)
            Ficheros y red: Files and network
            Ficheros y S3: Files and S3
            Red saliente: Outbound network
            Puertos y host: Ports and host
            Observar y herramientas: Observe and tools
            Métricas y listado: Metrics and listing
            Git: Git
            Agentes: Agents
            Servidor MCP: MCP server
            LangChain y Vercel AI: LangChain and Vercel AI
            Agente en el sandbox: Agent in the sandbox
            Proveedores del agente: Agent providers
            Desarrollar: Develop
            Probar en local (Docker + Floci): Test locally (Docker + Floci)
            Funciones opcionales: Optional features
            Resumen y coste: Overview and cost
            Pilas opcionales (rayito stack): Optional stacks (rayito stack)
            En el sandbox: In the sandbox
            Montajes S3: S3 mounts
            Tamaños: Sizes
            Pasarela de secretos: Secret gateway
            Volúmenes EFS (experimental): EFS volumes (experimental)
            Volúmenes EFS en tu VPC (experimental): EFS volumes in your VPC (experimental)
            Secretos: Secrets
            Imágenes: Images
            Templates declarativos: Declarative templates
            Templates de agente: Agent templates
            Observar: Observe
            Eventos y webhooks: Events and webhooks
            Exportación OTLP: OTLP export
            OpenTelemetry (SDK): OpenTelemetry (SDK)
            Índice de metadatos: Metadata index
            Panel de gestión (cuotas, coste y flota): Management dashboard (quotas, cost and fleet)
            Panel en tu cuenta (la pila dashboard): Dashboard in your account (the dashboard stack)
            Panel, fase 3 (CloudWatch, varias cuentas, avisos): Dashboard, phase 3 (CloudWatch, multiple accounts, alerts)
            Proxy local: Local proxy
            Experimental: Experimental
            Dominio propio (experimental): Custom domain (experimental)
            Migrar desde E2B: Migrate from E2B
            Diferencias: Differences
            Paridad: Parity
            Novedades: What's new
            Referencia: Reference
            Python: Python
            Resumen: Overview
            Subclientes: Subclients
            Modelos: Models
            Opcionales: Optional
            Excepciones: Exceptions
            Shim E2B: E2B shim
            TypeScript: TypeScript
            CLI: CLI
            API del panel de gestión: Management dashboard API
            Errores: Errors
            Variables de entorno: Environment variables
            Límites: Limits
            Otros lenguajes (gRPC): Other languages (gRPC)
            Changelog: Changelog
            Operación: Operations
            IAM: IAM
            Seguridad: Security
            Precios (MicroVMs, pool, agentes): Pricing (MicroVMs, pool, agents)
            Verificar una release: Verify a release
            Solución de problemas: Troubleshooting
            FAQ: FAQ
  # Sirve las fuentes desde el propio sitio: sin peticiones a terceros.
  # RAYITO_DOCS_PRIVACY=false lo apaga para compilar sin red. Sólo para
  # vistas previas locales: nunca para publicar, porque la fuente de títulos
  # (overrides/main.html) se pediría entonces a un tercero en tiempo de lectura.
  - privacy:
      enabled: !ENV [RAYITO_DOCS_PRIVACY, true]
  # Con dos idiomas cada objeto de la API tiene una URL por idioma: se enlaza
  # la más cercana a la página actual en vez de avisar de duplicados.
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      handlers:
        python:
          paths: ["../../clients/python/src"]
          options:
            docstring_style: google
            show_source: false
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            merge_init_into_class: true
            docstring_section_style: table
            filters: ["!^_"]
            heading_level: 2

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path:
        - !relative $config_dir/../..
        - !relative $config_dir/../../docs
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alejandro-cedeno-10/rayito
      name: Rayito en GitHub

# Las páginas que ya existían conservan su fichero (y su URL); la navegación
# las agrupa por tarea. Las nuevas viven en carpetas por sección.
