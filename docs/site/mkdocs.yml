site_name: Rayito
site_url: https://alejandro-cedeno-10.github.io/rayito/
site_description: Sandboxes de ejecución para agentes de IA sobre AWS Lambda MicroVMs, en tu propia cuenta.
docs_dir: docs
site_dir: _build
repo_url: https://github.com/alejandro-cedeno-10/rayito
repo_name: alejandro-cedeno-10/rayito
edit_uri: edit/main/docs/site/docs/
strict: true
copyright: >-
  Copyright 2026 Rayito contributors ·
  <a href="https://github.com/alejandro-cedeno-10/rayito/blob/main/LICENSE">Apache-2.0</a> ·
  <a href="https://github.com/alejandro-cedeno-10/rayito/blob/main/CONTRIBUTING.md">Contribuir</a> ·
  <a href="https://github.com/alejandro-cedeno-10/rayito/blob/main/SECURITY.md">Seguridad</a> ·
  <a href="https://github.com/alejandro-cedeno-10/rayito/blob/main/CODE_OF_CONDUCT.md">Código de conducta</a><br>
  Proyecto independiente, no afiliado, patrocinado ni respaldado por E2B ni por AWS;
  sus nombres se usan sólo para describir compatibilidad y plataforma.

# MkDocs 1.6: con `strict`, un enlace o un ancla rota rompe el build.
validation:
  omitted_files: warn
  absolute_links: relative_to_docs
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: es
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Modo claro

plugins:
  - search:
      lang: es
  - mkdocstrings:
      handlers:
        python:
          paths: ["../../clients/python/src"]
          options:
            docstring_style: google
            show_source: false
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_signature_annotations: true
            merge_init_into_class: true
            docstring_section_style: table
            filters: ["!^_"]
            heading_level: 2

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path:
        - !relative $config_dir/../..
        - !relative $config_dir/../../docs
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alejandro-cedeno-10/rayito
      name: Rayito en GitHub

