[project]
name = "rayito-kernel-sidecar"
version = "0.0.4"
description = "Jupyter kernel sidecar spawned by rayd inside the MicroVM (JSON lines over stdio). Never published."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = []
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.12",
    "mypy>=1.14",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["src/rayito_kernel_sidecar/_vendor", "ipython/startup"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["rayito_kernel_sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "kernel: arranca un ipykernel real con los pines de requirements.txt (solo Linux); excluido por defecto",
]
addopts = "-m 'not kernel'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]
exclude = ["src/rayito_kernel_sidecar/_vendor/"]

[[tool.mypy.overrides]]
module = ["rayito_kernel_sidecar._vendor.*"]
ignore_errors = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["jupyter_client", "jupyter_client.*", "zmq", "zmq.*", "traitlets", "traitlets.*"]
ignore_missing_imports = true
