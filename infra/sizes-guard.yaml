AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Rayito M15 sizes-catalog (optional): an IAM managed policy that only
  allows lambda:RunMicrovm on the specific image ARNs a `rayito image
  publish --sizes` run produced (Q90, docs/research/2026-10-e2b-out-of-
  scope.md): a cost guard against launching a size larger than intended.
  IAM-only: no billable resource, $0 at idle and per use. Action names and
  parameters: AWS_API_NOTES.md section 24. Deploy it only if you publish
  more than the baseline size and want to cap which image ARNs a caller may
  run; delete the stack to remove the policy (it never deletes an image).

Parameters:
  ImageArns:
    Type: CommaDelimitedList
    Description: >-
      The full ARNs of every image version this policy allows
      lambda:RunMicrovm on (the baseline plus every --sizes suffix you
      published, e.g. the ARNs of rayito-base, rayito-base-512mb and
      rayito-base-4gb). Pass them exactly as `rayito image list` prints
      `imageArn`; a bare name is not a valid Resource for an IAM policy.

Resources:
  RayitoRunAllowedSizes:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: >-
        Rayito sizes-catalog cost guard: lambda:RunMicrovm only on the
        listed image ARNs, so a caller cannot launch a size this account
        did not explicitly publish and allow.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RunAllowedSizeImages
            Effect: Allow
            Action:
              - lambda:RunMicrovm
            Resource: !Ref ImageArns

Outputs:
  PolicyArn:
    Description: Attach to the identity that is allowed to create sandboxes.
    Value: !Ref RayitoRunAllowedSizes
