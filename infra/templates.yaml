AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Rayito m15-templates (optional, OptionalStack convention, ADR-016): the
  managed policy RayitoTemplateBuilder for whoever calls Template.build(),
  scoped to lambda-microvms image build operations, PassRole on the build
  role from infra/iam.yaml, S3 access to the artifact bucket, and read-only
  access to the image's CloudWatch log group. Creates no S3 bucket, no
  image and no Lambda function ($0 at rest: IAM only). Delete the stack to
  remove the policy; it never deletes an image or a bucket object.
  AWS_API_NOTES.md section 27.

Parameters:
  ArtifactBucketArn:
    Type: String
    Description: >-
      ARN of the S3 bucket Template.build() uploads the build context zip
      to (bucket= of Template.build()); created and owned outside this
      stack.
  BuildRoleArn:
    Type: String
    Description: >-
      ARN of the IAM role Template.build() passes as buildRoleArn
      (infra/iam.yaml's BuildRoleArn output, the same role rayito image
      publish uses).
  ImageLogGroupPrefix:
    Type: String
    Default: /rayito
    MinLength: 1
    Description: >-
      Prefix of the CloudWatch log group names Template.build() reads to
      explain a failed build (/rayito/<name>, same prefix rayito image
      publish uses).
  BaseImageBucketArn:
    Type: String
    Default: ""
    Description: >-
      ARN of the bucket that already holds the rayito-base codeArtifact zip
      Template.build() reads from (fromBaseImage()); empty grants
      s3:GetObject on every bucket instead, because the base image may have
      been published from a bucket this stack does not know about. Set it
      when the base image's bucket is known, to scope the read down to it.

Conditions:
  HasBaseImageBucket: !Not [!Equals [!Ref BaseImageBucketArn, ""]]

Resources:
  RayitoTemplateBuilder:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: >-
        Rayito template builder: Template.build()/buildInBackground()/
        getBuildStatus()/exists() over lambda-microvms, plus the S3 and
        CloudWatch Logs access the build needs. Deliberately separate from
        any sandbox-launching policy (investigacion SS3.7): an agent that
        creates sandboxes should not also be able to publish images.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: BuildMicrovmImages
            Effect: Allow
            Action:
              - lambda:CreateMicrovmImage
              - lambda:UpdateMicrovmImage
              - lambda:GetMicrovmImage
              - lambda:GetMicrovmImageVersion
              - lambda:ListMicrovmImageVersions
              - lambda:ListMicrovmImageBuilds
              - lambda:GetMicrovmImageBuild
            Resource: "*"
          - Sid: PassBuildRole
            Effect: Allow
            Action:
              - iam:PassRole
            Resource: !Ref BuildRoleArn
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          - Sid: ReadAndWriteArtifacts
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:HeadObject
              - s3:PutObject
            Resource: !Sub "${ArtifactBucketArn}/rayito/templates/*"
          - Sid: ReadBaseImageArtifacts
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !If
              - HasBaseImageBucket
              - !Sub "${BaseImageBucketArn}/*"
              - "*"
          - Sid: ReadBuildLogsOnFailure
            Effect: Allow
            Action:
              - logs:DescribeLogStreams
              - logs:GetLogEvents
            Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ImageLogGroupPrefix}/*"

Outputs:
  TemplateBuilderPolicyArn:
    Description: Attach to the principal that calls Template.build()/buildInBackground().
    Value: !Ref RayitoTemplateBuilder
