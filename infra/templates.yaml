AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Rayito m15-templates (optional, OptionalStack convention, ADR-016): the
  managed policy RayitoTemplateBuilder for whoever calls Template.build(),
  scoped to lambda-microvms image build operations, PassRole on the build
  role from infra/iam.yaml, S3 access to the artifact bucket, and read-only
  access to the image's CloudWatch log group. Creates no S3 bucket, no
  image and no Lambda function ($0 at rest: IAM only). Delete the stack to
  remove the policy; it never deletes an image or a bucket object. The
  artifact bucket stays the caller's (ADR-022): give it a lifecycle rule
  on rayito/templates/ to expire old context zips. AWS_API_NOTES.md
  sections 10 and 27.

Parameters:
  ArtifactBucketArn:
    Type: String
    Description: >-
      ARN of the S3 bucket Template.build() uploads the build context zip
      to (bucket= of Template.build()); created and owned outside this
      stack.
  BuildRoleArn:
    Type: String
    Description: >-
      ARN of the IAM role Template.build() passes as buildRoleArn
      (infra/iam.yaml's BuildRoleArn output, the same role rayito image
      publish uses).
  ImageLogGroupPrefix:
    Type: String
    Default: /rayito
    MinLength: 1
    Description: >-
      Prefix of the CloudWatch log group names Template.build() reads to
      explain a failed build (/rayito/<name>, same prefix rayito image
      publish uses).
  BaseImageBucketArn:
    Type: String
    Default: ""
    Description: >-
      ARN of the bucket that holds the rayito-base codeArtifact zip
      Template.build() reads (fromBaseImage()), when it is not the artifact
      bucket. Empty means the artifact bucket: the read is never granted on
      any other bucket.
  ProtectedImageNamePrefix:
    Type: String
    Default: rayito-base
    MinLength: 1
    Description: >-
      Image names Template.build() may never create or update (the
      published base images: rayito-base, rayito-base-caps, ...). A
      template named with this prefix is denied.

Conditions:
  HasBaseImageBucket: !Not [!Equals [!Ref BaseImageBucketArn, ""]]

Resources:
  RayitoTemplateBuilder:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: >-
        Rayito template builder: Template.build()/buildInBackground()/
        getBuildStatus()/exists() over lambda-microvms, plus the S3 and
        CloudWatch Logs access the build needs. Deliberately separate from
        any sandbox-launching policy (investigacion SS3.7): an agent that
        creates sandboxes should not also be able to publish images.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: BuildMicrovmImages
            Effect: Allow
            Action:
              - lambda:UpdateMicrovmImage
              - lambda:GetMicrovmImage
              - lambda:GetMicrovmImageVersion
              - lambda:ListMicrovmImageVersions
            Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:*"
          # CreateMicrovmImage is authorized on "*", not on the new image's
          # ARN (AccessDeniedException "...lambda:CreateMicrovmImage on
          # resource: *", AWS_API_NOTES.md Q114), so it cannot be scoped by
          # name: a new name with the protected prefix can be created, but
          # an existing base image is never replaced (create on an existing
          # name fails) and every later build of it is an update, denied
          # below.
          - Sid: CreateMicrovmImages
            Effect: Allow
            Action:
              - lambda:CreateMicrovmImage
            Resource: "*"
          - Sid: NeverOverwriteBaseImages
            Effect: Deny
            Action:
              - lambda:UpdateMicrovmImage
            Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ProtectedImageNamePrefix}*"
          # create/update-microvm-image pass the AWS managed egress
          # connectors even when none is named (Q114, same rule as RunMicrovm
          # in AWS_API_NOTES.md section 10).
          - Sid: PassManagedNetworkConnectors
            Effect: Allow
            Action:
              - lambda:PassNetworkConnector
            Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:*"
          - Sid: PassBuildRole
            Effect: Allow
            Action:
              - iam:PassRole
            Resource: !Ref BuildRoleArn
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          - Sid: ReadAndWriteArtifacts
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource: !Sub "${ArtifactBucketArn}/rayito/templates/*"
          - Sid: ReadBaseImageArtifacts
            Effect: Allow
            Action:
              - s3:GetObject
            Resource: !If
              - HasBaseImageBucket
              - !Sub "${BaseImageBucketArn}/*"
              - !Sub "${ArtifactBucketArn}/*"
          - Sid: ReadBuildLogsOnFailure
            Effect: Allow
            Action:
              - logs:DescribeLogStreams
              - logs:GetLogEvents
            Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${ImageLogGroupPrefix}/*"

Outputs:
  TemplateBuilderPolicyArn:
    Description: Attach to the principal that calls Template.build()/buildInBackground().
    Value: !Ref RayitoTemplateBuilder
