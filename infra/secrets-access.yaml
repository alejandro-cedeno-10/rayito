AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Rayito M13a (optional): two least-privilege IAM managed policies for the
  SDK caller of SecretStore / SecretCache / secrets=, scoped to secrets under
  SecretPrefix. It creates no secret and no other resource ($0: IAM only).
  Action names and parameters: AWS_API_NOTES.md section 19. Deploy it only if
  you use Rayito's secrets; delete the stack to remove the policies.

Parameters:
  SecretPrefix:
    Type: String
    Default: rayito/
    MinLength: 1
    MaxLength: 256
    AllowedPattern: "^[A-Za-z0-9/_+=.@-]+$"
    Description: >-
      Secrets Manager name prefix the SDK uses (SecretStore(prefix=), default
      rayito/). Never empty: an empty prefix would grant every secret in the
      account and region.
  KmsKeyArn:
    Type: String
    Default: ""
    Description: >-
      ARN of the customer managed KMS key the secrets use (SecretStore(kms_key_id=));
      empty = the AWS managed key aws/secretsmanager, which needs no KMS statement.

Conditions:
  HasKmsKey: !Not [!Equals [!Ref KmsKeyArn, ""]]

Resources:
  RayitoSecretsReader:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: >-
        Rayito secrets reader: resolves secrets= (GetSecretValue with the
        SDK cache) and DescribeSecret under the prefix.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadSecretsUnderPrefix
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretPrefix}*"
          - !If
            - HasKmsKey
            - Sid: DecryptThroughSecretsManager
              Effect: Allow
              Action:
                - kms:Decrypt
              Resource: !Ref KmsKeyArn
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
            - !Ref AWS::NoValue

  RayitoSecretsAdmin:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: >-
        Rayito secrets admin: SecretStore / the E2B Secret shim (create,
        update, describe, list, destroy) plus everything the reader does.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ManageSecretsUnderPrefix
            Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
              - secretsmanager:CreateSecret
              - secretsmanager:PutSecretValue
              - secretsmanager:UpdateSecret
              - secretsmanager:DeleteSecret
            Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretPrefix}*"
          - Sid: ListSecretsNeedsStar
            Effect: Allow
            Action:
              - secretsmanager:ListSecrets
            Resource: "*"
          - !If
            - HasKmsKey
            - Sid: EncryptDecryptThroughSecretsManager
              Effect: Allow
              Action:
                - kms:Decrypt
                - kms:GenerateDataKey
              Resource: !Ref KmsKeyArn
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
            - !Ref AWS::NoValue

Outputs:
  ReaderPolicyArn:
    Description: Attach to the principal that runs Sandbox.create(secrets=...).
    Value: !Ref RayitoSecretsReader
  AdminPolicyArn:
    Description: Attach to the principal that creates, rotates and destroys Rayito secrets.
    Value: !Ref RayitoSecretsAdmin
