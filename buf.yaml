version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  # Streams share their event envelope across RPCs on purpose (ARCHITECTURE.md
  # "Diseño hexagonal", plan changes C10/C11): ProcessEvent, ExecuteEvent and
  # PtyServerMessage are the response of both Start/Create and Connect/Reattach,
  # and ConnectRequest/SendInputRequest are shared by ProcessService and PtyService.
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
