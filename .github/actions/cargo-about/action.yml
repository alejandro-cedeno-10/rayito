name: cargo-about (verified)
description: >-
  Descarga cargo-about 0.9.2 de su GitHub Release, lo comprueba contra un
  sha256 fijado y lo pone en PATH (`cargo about ...`). Genera
  THIRD_PARTY_LICENSES.md, que no se versiona (`make image-licenses`,
  openspec third-party-licenses). Mismo patrón que ./.github/actions/cargo-deny: un
  binario fijado por versión y checksum, sin compilar nada ni restaurar
  cachés, apto para los jobs de release.yml.

# CARGO_ABOUT_SHA256 coincide en tres fuentes (2026-10-05): el fichero
# `.sha256` de la release, el `digest` del asset en la API de GitHub y el
# sha256 calculado sobre la descarga. Subir de versión: cambiar las dos
# variables a la vez y el `CARGO_ABOUT_VERSION` del Makefile.
runs:
  using: composite
  steps:
    - name: cargo-about checked against a pinned sha256
      shell: bash
      env:
        CARGO_ABOUT_VERSION: 0.9.2
        CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
      run: |
        mkdir -p "$RUNNER_TEMP/cargo-about"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/cargo-about/cargo-about.tar.gz" \
          "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl.tar.gz"
        echo "${CARGO_ABOUT_SHA256}  $RUNNER_TEMP/cargo-about/cargo-about.tar.gz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/cargo-about/cargo-about.tar.gz" -C "$RUNNER_TEMP/cargo-about" --strip-components=1
        echo "$RUNNER_TEMP/cargo-about" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/cargo-about/cargo-about" --version | grep -qx "cargo-about ${CARGO_ABOUT_VERSION}"
