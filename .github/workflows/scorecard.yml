name: scorecard

# OpenSSF Scorecard (openspec m7-supply-chain, D3): semanal, en cada push a
# `main` y al cambiar la protección de ramas. `publish_results: true` exige
# repositorio público y rama por defecto; mientras el repo sea privado el
# análisis corre igual y sólo la publicación es rechazada por la acción.
# El SARIF sube como artefacto (5 días) y a code scanning. `workflow_dispatch`
# permite lanzarlo a mano (p. ej. si los eventos automáticos no se disparan).

on:
  branch_protection_rule:
  schedule:
    - cron: "23 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
