name: ci-x86-probe

# THROWAWAY: sondeo del cuelgue de crates/rayd/tests/** en runners x86_64
# (openspec m10-ci-x86). Vive sólo en la rama ci/x86-freeze-probe, nunca se
# fusiona a main y se borra antes de que el cambio real llegue a main. Mismas
# acciones y SHAs que ci.yml; permissions: contents: read.
#
# `pull_request.branches` filtra por la rama BASE del PR (main); el fichero
# sólo existe en esta rama, así que sólo corre en el PR en borrador del
# sondeo. `workflow_dispatch` queda declarado pero no es invocable (el
# fichero nunca llega a la rama por defecto): las repeticiones son
# "Re-run all jobs" o commits nuevos a esta rama.
#
# Fase 2 (36615379135): congelaron aislado a_stalled_second_subscriber_is_truncated_alone
# y los 3 sin-harden; fase 2b (linea-larga, 36618847164): la misma prueba con la salida a
# fichero no congela: falla a los 30 s y deja una línea de ~2.9 MB. Fase 3: m5_pty.rs
# arreglado (búsqueda lineal, panics acotados) + 3 suites completas de x86.
#
# Fase 1 (17 binarios, 3 intentos): sólo m5_pty congeló (intento 3 de
# 36609832898: el job superó sus 20 min, ni timeout ni cancel respondieron,
# sin log). Fase 2, sólo m5_pty:
#   aislado     cada test solo (`--exact`, 1 hilo), 10 repeticiones, 120 s
#               de timeout cada una: el job que congele nombra el test.
#   completo    binario entero, 5 repeticiones seguidas (línea base).
#   contenido   binario entero dentro de `systemd-run --scope` con TasksMax
#               y MemoryMax: si es agotamiento de pids/memoria, falla en vez
#               de congelar.
#   sin-harden  binario entero, 5 repeticiones, SIN harden-runner: en x86
#               instala un agente (auditd + eBPF "Armour" con
#               ENFORCE_KILL_BLOCK); en arm64 imprime "ARM runners are not
#               supported in the Harden-Runner community tier" y no instala
#               nada, y arm64 nunca ha congelado.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  probe:
    name: ${{ matrix.mode }} ${{ matrix.rep }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.mode == 'suite' && 45 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: linea-larga, rep: 1 }
          - { mode: linea-larga, rep: 2 }
          - { mode: linea-larga-harden, rep: 1 }
          - { mode: suite, rep: 1 }
          - { mode: suite, rep: 2 }
          - { mode: suite, rep: 3 }
    steps:
      - if: matrix.mode != 'sin-harden' && matrix.mode != 'linea-larga'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Diagnóstico del runner antes de correr nada
        run: |
          id
          ulimit -a
          nproc
          free -m
          df -h
          cat /proc/sys/kernel/pid_max /proc/sys/kernel/threads-max
          echo "descriptores que el runner deja al shell del paso:"
          ls -l /proc/$$/fd
          sudo auditctl -s || true
          sudo auditctl -l | head -40 || true
          ps -eo user,pid,ppid,pgid,sid,stat,etime,cmd --forest | head -80

      - name: Compilar m5_pty (sin correrlo)
        if: matrix.mode != 'suite'
        id: build
        run: |
          binary="$(cargo test -p rayd --test m5_pty --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "m5_pty" and .executable != null) | .executable')"
          test -x "$binary"
          echo "bin_path=$binary" >> "$GITHUB_OUTPUT"

      - name: Muestreador de fondo (cada 10s, al log en vivo)
        run: |
          {
            while true; do
              date
              uptime
              free -m | sed -n 2p
              ps -e --no-headers | wc -l
              ps -u "$USER" --no-headers | wc -l
              find /proc/self/fd -mindepth 1 | wc -l
              find /dev/pts -mindepth 1 | wc -l
              sudo auditctl -s 2>/dev/null | grep -E '^(lost|backlog) ' | tr '\n' ' '; echo
              df -h / | tail -1
              echo "---"
              sleep 10
            done
          } &
          echo "sampler_pid=$!" >> "$GITHUB_ENV"

      - name: Suite completa de x86 (mismo comando que propone ci.yml)
        if: matrix.mode == 'suite'
        timeout-minutes: 25
        run: |
          status=0
          timeout --kill-after=30s 20m cargo test --workspace --locked --no-fail-fast > "$RUNNER_TEMP/cargo-test.log" 2>&1 < /dev/null || status=$?
          echo "línea más larga: $(wc -L < "$RUNNER_TEMP/cargo-test.log") bytes"
          grep -E '^test a_stalled|^test result|Running tests/' "$RUNNER_TEMP/cargo-test.log" || true
          cut -c1-2000 "$RUNNER_TEMP/cargo-test.log"
          exit "$status"

      - name: Correr (${{ matrix.mode }})
        if: matrix.mode != 'suite'
        env:
          BIN: ${{ steps.build.outputs.bin_path }}
          MODE: ${{ matrix.mode }}
        run: |
          status=0
          case "$MODE" in
            aislado)
              for i in $(seq 1 10); do
                echo "::group::$TEST repetición $i"
                timeout --kill-after=10s 120s "$BIN" --exact "${TEST:?}" --test-threads=1 2>&1 || status=$?
                echo "::endgroup::"
                echo "repetición $i -> $status"
                [ "$status" -eq 0 ] || break
              done
              ;;
            linea-larga|linea-larga-harden)
              # Misma prueba que congeló (aislado a_stalled...), pero la
              # salida cruda va a fichero y al log del runner sólo llegan
              # líneas recortadas a 300 caracteres + la línea más larga.
              for i in $(seq 1 10); do
                start=$(date +%s)
                rc=0
                timeout --kill-after=10s 120s "$BIN" --exact a_stalled_second_subscriber_is_truncated_alone \
                  --test-threads=1 > "$RUNNER_TEMP/raw-$i.log" 2>&1 < /dev/null || rc=$?
                echo "::group::repetición $i (rc=$rc, $(( $(date +%s) - start )) s)"
                cut -c1-300 "$RUNNER_TEMP/raw-$i.log"
                echo "::endgroup::"
                echo "repetición $i -> rc=$rc, $(( $(date +%s) - start )) s, línea más larga: $(wc -L < "$RUNNER_TEMP/raw-$i.log") bytes, total $(wc -c < "$RUNNER_TEMP/raw-$i.log") bytes"
                [ "$rc" -eq 0 ] || status=$rc
              done
              ;;
            completo|sin-harden)
              for i in $(seq 1 5); do
                echo "::group::m5_pty completo repetición $i"
                timeout --kill-after=15s 10m "$BIN" --test-threads=2 2>&1 || status=$?
                echo "::endgroup::"
                echo "repetición $i -> $status"
                [ "$status" -eq 0 ] || break
              done
              ;;
            contenido)
              for i in $(seq 1 5); do
                echo "::group::m5_pty contenido repetición $i"
                sudo systemd-run --scope --uid=runner -p TasksMax=4096 -p MemoryMax=10G -- \
                  timeout --kill-after=15s 10m "$BIN" --test-threads=2 2>&1 || status=$?
                echo "::endgroup::"
                echo "repetición $i -> $status"
                [ "$status" -eq 0 ] || break
              done
              ;;
          esac
          exit "$status"

      - name: Parar el muestreador de fondo
        if: always()
        run: kill "$sampler_pid" 2>/dev/null || true

      - name: dmesg, audit y árbol de procesos
        if: always()
        run: |
          sudo dmesg -T | tail -100
          sudo auditctl -s || true
          ps -eo user,pid,ppid,pgid,sid,stat,etime,cmd --forest | head -200
