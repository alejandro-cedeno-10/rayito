name: release

# Publica cada componente desde su tag (openspec m7-supply-chain, D10):
#
#   python-v<v>      clients/python  → PyPI (Trusted Publishing, attestations PEP 740)
#   typescript-v<v>  clients/typescript → npm (trusted publishing con provenance)
#   rayd-v<v>        crates/rayd     → assets de la GitHub Release del tag:
#                    rayd (cargo auditable, .dep-v0), rayito-image.zip,
#                    rayd.cdx.json (CycloneDX 1.5), LICENSE, NOTICE,
#                    THIRD_PARTY_LICENSES.md (cargo-about), los dos bundles
#                    cosign (keyless, Sigstore), SHA256SUMS y su bundle
#                    SHA256SUMS.sigstore.json
#
# Los tags los crea release-please (release-please.yml). Un tag creado con
# GITHUB_TOKEN no dispara este workflow: en ese caso se lanza a mano con
# `workflow_dispatch`, eligiendo el tag en "Use workflow from" y pasando el
# mismo tag en `tag` con `dry_run: false`. Con `dry_run: true` (por defecto)
# sólo corren los jobs de build: construyen, comprueban y suben los
# artefactos sin firmar al run, y no se firma ni se publica nada. Sirve para
# ensayar desde cualquier rama cuyos manifiestos ya lleven la versión del tag
# (p. ej. la rama del PR de release).
#
# python y typescript están partidos en build/publish (M10, C-10 + residuo de
# H-02): el job `*-build` no lleva `environment` ni `id-token: write` y es el
# único que hace checkout e instala/ejecuta código de terceros (`pnpm
# install`, `uv build`); el job `*-publish` lleva el token OIDC pero no hace
# checkout, no instala nada y no ejecuta más que la propia acción de
# publicación, tras verificar con `sha256sum -c` que el artefacto descargado
# es bit a bit el que produjo `*-build`. Así un paquete o `build-backend`
# comprometido puede como mucho falsificar el `.tgz`/`dist/` que sube el
# `upload-artifact` del build (que no lleva ningún secreto), pero nunca ve el
# token OIDC. El *Trusted Publisher* de PyPI y de npm liga el token al
# fichero de workflow y al `environment` del job que lo pide, no al nombre
# del job: mover la publicación a `python-publish`/`typescript-publish` no
# exige tocar nada en PyPI ni en npmjs.com (docs/RELEASING.md).
#
# rayd sigue el mismo patrón en tres jobs (sec-supply-chain-ci, SC-02):
# `rayd-build` (sólo `contents: read`) hace checkout, compila y empaqueta;
# `rayd-sign` (`id-token: write`, sin checkout) comprueba con `sha256sum -c`
# lo que produjo el build y sólo ejecuta cosign; `rayd-upload` (`contents:
# write`, sin checkout) vuelve a comprobarlo y sube los assets sin
# `--clobber`: un asset publicado no se reemplaza nunca desde aquí. Un
# `build.rs` o una herramienta de build comprometidos ya no ven ni el token
# OIDC ni un token con permiso de escritura sobre las releases.
#
# Avisos de licencia (openspec third-party-licenses): `rayd-build` comprueba
# con `make licenses-check` que el THIRD_PARTY_LICENSES.md del tag es el que
# cargo-about (binario fijado por sha256, ./.github/actions/cargo-about)
# genera desde su Cargo.lock y que lista todo crate del `.dep-v0` del
# binario; lo mete, con LICENSE y NOTICE, en image/licenses/ (y de ahí en el
# zip firmado) y entre los assets. `rayd-sign` firma además SHA256SUMS
# (SHA256SUMS.sigstore.json), así que los avisos y el SBOM, que no llevan
# bundle propio, quedan cubiertos por una firma con la misma identidad.
#
# Todo job con `id-token: write` (python-publish, typescript-publish y
# rayd-sign) declara su environment con revisor y corre sólo con
# `publish == 'true'` (sec-supply-chain-followups, SC-A01): Fulcio no emite
# ningún certificado con la identidad `release.yml@refs/tags/rayd-v*` antes
# de que el mantenedor apruebe el run, y un ensayo nunca firma. La
# identidad de la firma la fijan el fichero de workflow y el tag, no quién
# creó el tag: restringir también la creación de tags `rayd-v*` es un ajuste
# del repositorio (docs/RELEASING.md).
#
# Ningún job de este workflow restaura una caché (SC-01): un run de tag
# restaura las cachés del ámbito de la rama por defecto, que puede escribir
# cualquier job de `main`. zig llega por `./.github/actions/zig` (sha256
# fijado), las herramientas de cargo se instalan con `--force` en una raíz
# nueva bajo `RUNNER_TEMP`, y setup-uv/setup-node llevan la caché apagada;
# `scripts/tests/test_release_workflow.py` lo comprueba sobre el grafo de jobs.
#
# Publicar exige que el commit del tag esté en `main` (job `resolve`): un tag
# empujado sobre otra rama no se salta la revisión ni los checks de `main`
# (SC-03).
#
# `npm publish` es la ÚNICA invocación de npm del repositorio (pnpm es el
# gestor para todo lo demás): el trusted publishing de npm está implementado
# sólo en el CLI de npm ≥ 11.5.1 (pnpm 9.15.4 no hace el intercambio OIDC).
# Node 24 trae npm 11.x; el job de publicación lo comprueba y falla con un
# mensaje claro.
#
# Pasos manuales, una sola vez (docs/RELEASING.md):
#   1. PyPI → Trusted Publisher para `rayito`: repo alejandro-cedeno-10/rayito, workflow
#      `release.yml`, environment `pypi` (admite pending publisher).
#   2. npm → primera publicación manual y luego Settings → Trusted Publisher:
#      GitHub Actions, alejandro-cedeno-10/rayito, workflow `release.yml`, environment `npm`.
#   3. Environments `pypi`, `npm` y `release` en GitHub, con required
#      reviewers y política de tags (`python-v*`, `typescript-v*`, `rayd-v*`).
#   4. Opcional: secreto `RELEASE_PLEASE_TOKEN` (PAT fine-grained) para que
#      los tags de release-please disparen este workflow solos.

on:
  push:
    tags: ["python-v*", "typescript-v*", "rayd-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a publicar o ensayar (python-v… | typescript-v… | rayd-v…)"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Construir, comprobar y firmar sin publicar"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # uv nunca vuelve a resolver un uv.lock desfasado (sec-supply-chain-followups,
  # SC-A05). La versión y el checksum de uv viven en ./.github/actions/setup-uv.
  UV_LOCKED: "1"
  RAYD_ASSETS: rayd rayd.sigstore.json rayito-image.zip rayito-image.zip.sigstore.json rayd.cdx.json LICENSE NOTICE THIRD_PARTY_LICENSES.md SHA256SUMS SHA256SUMS.sigstore.json

jobs:
  resolve:
    name: resolve component and version from the tag
    runs-on: ubuntu-24.04
    outputs:
      component: ${{ steps.tag.outputs.component }}
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
            publish=true
          else
            tag="$INPUT_TAG"
            test -n "$tag" || { echo "workflow_dispatch needs the 'tag' input (e.g. rayd-v0.2.0)"; exit 1; }
            if [ "$DRY_RUN" = "false" ]; then
              test "$REF" = "refs/tags/$tag" || {
                echo "publishing needs the run to start from the tag itself: Use workflow from → Tags → $tag (got $REF)"
                exit 1
              }
              publish=true
            else
              publish=false
            fi
          fi
          case "$tag" in
            python-v[0-9]*) component=python; version="${tag#python-v}" ;;
            typescript-v[0-9]*) component=typescript; version="${tag#typescript-v}" ;;
            rayd-v[0-9]*) component=rayd; version="${tag#rayd-v}" ;;
            *) echo "unsupported tag shape: $tag (expected python-v*, typescript-v* or rayd-v*)"; exit 1 ;;
          esac
          {
            echo "component=$component"
            echo "version=$version"
            echo "tag=$tag"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"
          echo "component=$component version=$version publish=$publish"
      - name: A published tag points at a commit of main
        if: steps.tag.outputs.publish == 'true'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "the tagged commit is not on main: publishing refuses a commit that skipped main's review and required checks"
            exit 1
          }

  python-build:
    name: python → build sdist and wheel (no publishing credential)
    needs: resolve
    if: needs.resolve.outputs.component == 'python'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha256sums_sha256: ${{ steps.digest.outputs.sha256 }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Tag matches pyproject version
        run: |
          actual="$(cd clients/python && uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$VERSION" != "$actual" ]; then
            echo "el tag python-v$VERSION no coincide con pyproject.toml ($actual)"
            exit 1
          fi
      - name: Build sdist and wheel
        run: cd clients/python && uv build
      - name: SHA256SUMS right after uv build, before any check runs third-party code (next to dist/, so packages-dir stays distribution-only)
        working-directory: clients/python
        run: |
          sha256sum dist/*.whl dist/*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - id: digest
        working-directory: clients/python
        run: echo "sha256=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Check wheel contents
        run: python3 scripts/check_wheel.py clients/python/dist/*.whl
      - name: twine check (twine and its graph from hash-pinned requirements)
        run: |
          uv venv "$RUNNER_TEMP/twine"
          uv pip install --python "$RUNNER_TEMP/twine" --require-hashes --no-deps --only-binary :all: \
            -r .github/release/requirements-twine.txt
          "$RUNNER_TEMP/twine/bin/twine" check clients/python/dist/*
      - name: dist/ is still what uv build produced
        working-directory: clients/python
        run: sha256sum -c SHA256SUMS
      # Hidden entries (the `.gitignore` uv build writes) never travel:
      # upload-artifact skips them and the publish action globs `dist/*`.
      - name: dist/ holds exactly the wheel and sdist of this version, both in SHA256SUMS (sha256sum -c ignores unlisted files)
        working-directory: clients/python
        run: |
          expected="$(printf 'rayito-%s-py3-none-any.whl\nrayito-%s.tar.gz\n' "$VERSION" "$VERSION" | sort)"
          actual="$(find dist -mindepth 1 -maxdepth 1 ! -name '.*' -printf '%f\n' | sort)"
          test "$actual" = "$expected" || {
            printf 'dist/ must hold exactly the wheel and sdist of %s, found:\n%s\n' "$VERSION" "$actual"; exit 1
          }
          test "$(cut -d' ' -f3 SHA256SUMS | sed 's#^dist/##' | sort)" = "$expected" || {
            echo "SHA256SUMS must list exactly the wheel and sdist of $VERSION"; exit 1
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist-${{ needs.resolve.outputs.version }}
          path: |
            clients/python/dist/
            clients/python/SHA256SUMS
          if-no-files-found: error

  python-publish:
    name: python → PyPI (Trusted Publishing)
    needs: [resolve, python-build]
    if: needs.resolve.outputs.component == 'python' && needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist-${{ needs.resolve.outputs.version }}
          # Inside the workspace (created by the runner, no checkout needed),
          # not runner.temp: gh-action-pypi-publish runs twine in a Docker
          # container action that only mounts GITHUB_WORKSPACE, so a host
          # path under runner.temp does not exist in there.
          path: python-dist
      - name: SHA256SUMS is the one python-build produced
        working-directory: python-dist
        env:
          SHA256SUMS_SHA256: ${{ needs.python-build.outputs.sha256sums_sha256 }}
        run: echo "${SHA256SUMS_SHA256}  SHA256SUMS" | sha256sum -c -
      - name: dist/ matches SHA256SUMS
        working-directory: python-dist
        run: sha256sum -c SHA256SUMS
      - name: dist/ holds exactly the wheel and sdist of this version (the action uploads every file in packages-dir)
        working-directory: python-dist
        run: |
          expected="$(printf 'rayito-%s-py3-none-any.whl\nrayito-%s.tar.gz\n' "$VERSION" "$VERSION" | sort)"
          actual="$(find dist -mindepth 1 -maxdepth 1 ! -name '.*' -printf '%f\n' | sort)"
          test "$actual" = "$expected" || {
            printf 'dist/ must hold exactly the wheel and sdist of %s, found:\n%s\n' "$VERSION" "$actual"; exit 1
          }
          test "$(cut -d' ' -f3 SHA256SUMS | sed 's#^dist/##' | sort)" = "$expected" || {
            echo "SHA256SUMS must list exactly the wheel and sdist of $VERSION"; exit 1
          }
      - name: Publish to PyPI (OIDC, attestations on by default)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: python-dist/dist

  typescript-build:
    name: typescript → build tarball (no publishing credential)
    needs: resolve
    if: needs.resolve.outputs.component == 'typescript'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tgz_sha256: ${{ steps.digest.outputs.sha256 }}
    defaults:
      run:
        working-directory: clients/typescript
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Tag matches package.json version
        run: |
          actual="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$actual" ]; then
            echo "el tag typescript-v$VERSION no coincide con package.json ($actual)"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - run: pnpm pack:check
      - name: pnpm pack → rayito-<version>.tgz
        run: |
          pnpm pack
          test -f "rayito-$VERSION.tgz"
      - id: digest
        run: echo "sha256=$(sha256sum "rayito-$VERSION.tgz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball-${{ needs.resolve.outputs.version }}
          path: clients/typescript/rayito-${{ needs.resolve.outputs.version }}.tgz
          if-no-files-found: error

  typescript-publish:
    name: typescript → npm (trusted publishing)
    needs: [resolve, typescript-build]
    if: needs.resolve.outputs.component == 'typescript' && needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      id-token: write
      contents: read
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: npm ≥ 11.5.1 (trusted publishing lives in the npm CLI)
        run: |
          required=11.5.1
          actual="$(npm --version)"
          lowest="$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n1)"
          if [ "$lowest" != "$required" ]; then
            echo "npm $actual is below $required: npm trusted publishing needs npm >= $required (Node 24 bundles 11.x)"
            exit 1
          fi
          echo "npm $actual"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball-${{ needs.resolve.outputs.version }}
          path: ${{ runner.temp }}/npm
      - name: rayito-<version>.tgz is the one typescript-build produced
        working-directory: ${{ runner.temp }}/npm
        env:
          TGZ_SHA256: ${{ needs.typescript-build.outputs.tgz_sha256 }}
        run: echo "${TGZ_SHA256}  rayito-$VERSION.tgz" | sha256sum -c -
      - name: npm publish (OIDC, provenance attached automatically; the only npm call in the repo)
        working-directory: ${{ runner.temp }}/npm
        run: npm publish "rayito-$VERSION.tgz" --access public --ignore-scripts

  rayd-build:
    name: rayd → build the release assets (no signing or release credential)
    needs: resolve
    if: needs.resolve.outputs.component == 'rayd'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      sha256sums_sha256: ${{ steps.digest.outputs.sha256 }}
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
      RAYD_BIN: target/aarch64-unknown-linux-musl/release/rayd
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches [workspace.package].version
        run: |
          actual="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "$VERSION" != "$actual" ]; then
            echo "el tag rayd-v$VERSION no coincide con Cargo.toml [workspace.package] ($actual)"
            exit 1
          fi
      - name: Toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - uses: ./.github/actions/zig
      - name: Build tools into a fresh root (never a ~/.cargo/bin a cache could have planted)
        env:
          CARGO_HOME: ${{ runner.temp }}/cargo-tools-home
        run: |
          cargo install --locked --force --root "$RUNNER_TEMP/cargo-tools" cargo-zigbuild@0.23.4 cargo-auditable@0.7.6 cargo-cyclonedx@0.5.9
          echo "$RUNNER_TEMP/cargo-tools/bin" >> "$GITHUB_PATH"
      - name: cargo auditable zigbuild (embeds the crate graph in .dep-v0, same --remap-path-prefix rustflags as `make build`'s REMAP_CONFIG)
        run: |
          cargo auditable zigbuild --release --locked --target aarch64-unknown-linux-musl -p rayd \
            --config "build.rustflags=[\"--remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/cargo\",\"--remap-path-prefix=${CARGO_TARGET_DIR:-$PWD/target}=/target\"]"
      - name: .dep-v0 names root rayd at the workspace version with tonic, tokio, axum, nix
        run: python3 scripts/check_auditable.py "$RAYD_BIN"
      - name: rayd embeds no /home/runner build path (--remap-path-prefix, same rustflags as `make build`)
        run: |
          count="$(strings "$RAYD_BIN" | grep -c '/home/runner' || true)"
          echo "/home/runner matches: $count"
          test "$count" -eq 0
      - name: CycloneDX 1.5 SBOM (crates/rayd/rayd.cdx.json)
        run: cargo cyclonedx --manifest-path crates/rayd/Cargo.toml --target aarch64-unknown-linux-musl --format json --no-build-deps --spec-version 1.5
      - uses: ./.github/actions/cargo-about
      - name: THIRD_PARTY_LICENSES.md is what cargo-about generates from the tag's Cargo.lock and lists exactly the crates cargo tree compiles into rayd
        run: make licenses-check
      - name: every crate THIRD_PARTY_LICENSES.md lists is recorded in the binary's .dep-v0, and every crate NOTICE file is carried
        run: |
          cargo metadata --format-version 1 --locked --offline > "$RUNNER_TEMP/cargo-metadata.json"
          python3 scripts/check_third_party_licenses.py THIRD_PARTY_LICENSES.md \
            --binary "$RAYD_BIN" --metadata "$RUNNER_TEMP/cargo-metadata.json"
      - name: rayito-image.zip (the artefact the maintainer publishes with make image-publish), with LICENSE, NOTICE and THIRD_PARTY_LICENSES.md in licenses/
        run: |
          cp "$RAYD_BIN" image/rayd
          python3 scripts/copy_sidecar.py kernel-sidecar image/kernel-sidecar
          make image-licenses
          python3 scripts/image_zip.py image image/rayito-image.zip
      - name: Stage the unsigned assets and their SHA256SUMS
        run: |
          mkdir -p release
          cp "$RAYD_BIN" release/rayd
          cp image/rayito-image.zip release/rayito-image.zip
          cp crates/rayd/rayd.cdx.json release/rayd.cdx.json
          cp LICENSE NOTICE THIRD_PARTY_LICENSES.md release/
          (cd release && sha256sum rayd rayito-image.zip rayd.cdx.json LICENSE NOTICE THIRD_PARTY_LICENSES.md > SHA256SUMS && cat SHA256SUMS)
      - id: digest
        run: echo "sha256=$(sha256sum release/SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rayd-build-${{ needs.resolve.outputs.version }}
          path: release/
          if-no-files-found: error

  rayd-sign:
    name: rayd → cosign keyless signatures (environment release; no checkout, no build tooling)
    needs: [resolve, rayd-build]
    if: needs.resolve.outputs.component == 'rayd' && needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
      contents: read
    outputs:
      sha256sums_sha256: ${{ steps.digest.outputs.sha256 }}
      sha256sums_bundle_sha256: ${{ steps.digest.outputs.bundle_sha256 }}
    env:
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rayd-build-${{ needs.resolve.outputs.version }}
          path: ${{ runner.temp }}/release
      - name: SHA256SUMS is the one rayd-build produced
        working-directory: ${{ runner.temp }}/release
        env:
          SHA256SUMS_SHA256: ${{ needs.rayd-build.outputs.sha256sums_sha256 }}
        run: echo "${SHA256SUMS_SHA256}  SHA256SUMS" | sha256sum -c -
      - name: The assets match SHA256SUMS
        working-directory: ${{ runner.temp }}/release
        run: sha256sum -c SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: cosign sign-blob (keyless, bundles next to the assets)
        working-directory: ${{ runner.temp }}/release
        run: |
          cosign sign-blob --yes --bundle rayd.sigstore.json rayd
          cosign sign-blob --yes --bundle rayito-image.zip.sigstore.json rayito-image.zip
      - name: cosign verify-blob self-check (the exact identity of this ref, as users verify it)
        working-directory: ${{ runner.temp }}/release
        run: |
          for asset in rayd rayito-image.zip; do
            cosign verify-blob --bundle "$asset.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer "$OIDC_ISSUER" "$asset"
          done
      - name: SHA256SUMS over the signed assets, their bundles, the SBOM and the license notices
        working-directory: ${{ runner.temp }}/release
        run: |
          sha256sum rayd rayd.sigstore.json rayito-image.zip rayito-image.zip.sigstore.json rayd.cdx.json LICENSE NOTICE THIRD_PARTY_LICENSES.md > SHA256SUMS
          cat SHA256SUMS
      - name: cosign sign-blob SHA256SUMS (covers the SBOM and the notices, which carry no bundle of their own)
        working-directory: ${{ runner.temp }}/release
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: cosign verify-blob self-check of SHA256SUMS (the exact identity of this ref)
        working-directory: ${{ runner.temp }}/release
        run: |
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "$OIDC_ISSUER" SHA256SUMS
      - id: digest
        working-directory: ${{ runner.temp }}/release
        run: |
          echo "sha256=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "bundle_sha256=$(sha256sum SHA256SUMS.sigstore.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rayd-release-${{ needs.resolve.outputs.version }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error

  rayd-upload:
    name: rayd → upload to the release created by release-please (environment release)
    needs: [resolve, rayd-sign]
    if: needs.resolve.outputs.component == 'rayd' && needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rayd-release-${{ needs.resolve.outputs.version }}
          path: ${{ runner.temp }}/release
      - name: SHA256SUMS and its bundle are the ones rayd-sign produced
        working-directory: ${{ runner.temp }}/release
        env:
          SHA256SUMS_SHA256: ${{ needs.rayd-sign.outputs.sha256sums_sha256 }}
          SHA256SUMS_BUNDLE_SHA256: ${{ needs.rayd-sign.outputs.sha256sums_bundle_sha256 }}
        run: |
          echo "${SHA256SUMS_SHA256}  SHA256SUMS" | sha256sum -c -
          echo "${SHA256SUMS_BUNDLE_SHA256}  SHA256SUMS.sigstore.json" | sha256sum -c -
      - name: The assets match SHA256SUMS
        working-directory: ${{ runner.temp }}/release
        run: sha256sum -c SHA256SUMS
      - name: The release carries none of these assets yet (a published asset is never replaced)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          read -ra assets <<< "$RAYD_ASSETS"
          for asset in "${assets[@]}"; do
            if printf '%s\n' "$existing" | grep -qxF "$asset"; then
              echo "$TAG already has $asset: refusing to replace a published asset"
              exit 1
            fi
          done
      - name: Upload the assets (no --clobber)
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -ra assets <<< "$RAYD_ASSETS"
          gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
