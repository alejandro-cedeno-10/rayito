# Actualizaciones semanales agrupadas por ecosistema (minor + patch en un solo
# PR; los majors abren el suyo porque el árbol de Cargo va fijado con `=`).
# `kernel-sidecar` lo vigila sólo el ecosistema `uv`: `pip` sobre el mismo
# directorio abría cada PR por duplicado sobre `requirements.txt`.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: uv
    directory: /clients/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      uv-python-client:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: uv
    directory: /kernel-sidecar
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      uv-kernel-sidecar:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: npm
    directory: /clients/typescript
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # `@types/node` sigue al Node mínimo soportado (`engines`: >= 20); sus
    # majors se suben a mano cuando sube ese mínimo.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: docker
    directory: /image
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns: ["*"]
        update-types: ["minor", "patch"]
