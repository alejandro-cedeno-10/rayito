syntax = "proto3";

package rayito.v1;

// Owned by m15-efs-volumes (ADR-018, experimental). `rayd` ships only
// `UnavailableEfsMounter` today (ahead of the EFS-1..EFS-20 measurement
// campaign, docs/research/2026-10-efs-persistence.md): the
// `efs_volumes` section of `ConfigureRequest` always answers
// `SECTION_CODE_UNSUPPORTED`, whatever `EfsVolumesConfig` it carries. The
// messages are complete now so a future adapter needs no wire change.
message EfsVolumesConfig {
  // A present (even empty) section replaces the sandbox's whole desired
  // set of volumes (`configure.proto` semantics); at most 4
  // (research doc §5 "Volúmenes por sandbox").
  repeated EfsVolumeMount mounts = 1;
}

message EfsVolumeMount {
  // Absolute, canonical, under `/mnt/` or `/home/user/`
  // (`rayito._mount_path`/`mount-path.ts`).
  string mount_path = 1;
  // `fs-[0-9a-f]{8,40}`.
  string file_system_id = 2;
  // `fsap-[0-9a-f]{8,40}`.
  string access_point_id = 3;
  bool read_only = 4;
  // Dotted-quad; empty lets the adapter resolve it itself (research doc
  // R3, EFS-5: avoids depending on the guest resolving the VPC's private
  // DNS zone for the mount target). Always empty today — no SDK calls
  // `DescribeMountTargets` yet; that lands with the first real mounter.
  string mount_target_ip = 5;
}

message EfsVolumesStatus {
  repeated EfsVolumeStatus volumes = 1;
}

message EfsVolumeStatus {
  string mount_path = 1;
  EfsVolumeState state = 2;
  // Lowercase snake string this file documents below; never an AWS
  // message, a file-system id, an access-point id or a path.
  string last_error_class = 3;
}

// Mirrors `rayd_core::volume::MountState`. `last_error_class` values for
// `FAILED`: `network`, `iam_denied`, `not_found`, `tls`, `helper_missing`,
// `timeout` (research doc §4.3 `EfsUtilsMounter`, §8 "Modos de fallo").
enum EfsVolumeState {
  EFS_VOLUME_STATE_UNSPECIFIED = 0;
  EFS_VOLUME_STATE_REQUESTED = 1;
  EFS_VOLUME_STATE_MOUNTING = 2;
  EFS_VOLUME_STATE_MOUNTED = 3;
  EFS_VOLUME_STATE_DEGRADED = 4;
  EFS_VOLUME_STATE_REMOUNTING = 5;
  EFS_VOLUME_STATE_UNMOUNTED = 6;
  EFS_VOLUME_STATE_FAILED = 7;
}
