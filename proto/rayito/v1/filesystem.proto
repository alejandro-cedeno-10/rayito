syntax = "proto3";

package rayito.v1;

import "rayito/v1/common.proto";

service FilesystemService {
  // Lectura en streaming en chunks de 256 KiB.
  rpc Read(ReadRequest) returns (stream ReadResponse);

  // Escritura en streaming. Un WriteRequest con `path` empieza un fichero nuevo
  // (cerrando el anterior), así que N ficheros pueden compartir un stream.
  // Chunks <= 1 MiB; un mensaje > 4 MiB se rechaza con INVALID_ARGUMENT.
  // El agente escribe en un temporal del mismo directorio, fsync y rename
  // (atómico), creando padres y asignando propietario al usuario indicado.
  rpc Write(stream WriteRequest) returns (WriteResponse);

  // NOT_FOUND si no existe (el SDK lo traduce en exists() == false).
  rpc Stat(StatRequest) returns (StatResponse);
  rpc ListDir(ListDirRequest) returns (ListDirResponse);
  // ALREADY_EXISTS si el directorio ya existe (SDK: make_dir() == false);
  // INVALID_ARGUMENT si existe algo que no es un directorio.
  rpc MakeDir(MakeDirRequest) returns (MakeDirResponse);
  rpc Move(MoveRequest) returns (MoveResponse);
  rpc Remove(RemoveRequest) returns (RemoveResponse);

  // Observa un directorio. El primer mensaje es WatchStarted, emitido sólo
  // cuando el watch inotify está instalado; NOT_FOUND / INVALID_ARGUMENT llegan
  // como status gRPC antes de cualquier mensaje. Sin debounce.
  rpc WatchDir(WatchDirRequest) returns (stream WatchDirResponse);

  // Empaqueta el HOME del usuario (tar.gz, lista de exclusión documentada)
  // y lo sube a S3 con las credenciales del execution role, como root.
  // Un solo checkpoint o restore a la vez por sandbox (FAILED_PRECONDITION).
  rpc Checkpoint(CheckpointRequest) returns (stream CheckpointEvent);
  // Descarga <key_prefix>/manifest.json y <key_prefix>/home.tar.gz y los
  // extrae en el HOME del usuario (sin seguir ni escapar del HOME).
  // NOT_FOUND si no hay manifest bajo el prefijo.
  rpc Restore(RestoreRequest) returns (stream RestoreEvent);

  // Transferencias por URLs prefirmadas de S3 (ADR-010). rayd no guarda
  // credenciales: el SDK firma cada petición con las credenciales del
  // llamante y rayd sólo llama a URLs cuyo host y ruta coinciden con el
  // S3Object de la petición (INVALID_ARGUMENT antes de cualquier I/O de red).
  // Como mucho 16 transferencias esperando o en curso por sandbox
  // (RESOURCE_EXHAUSTED); NOT_FOUND para un transfer_id desconocido.
  //
  // Importa un objeto a `path`: con `wait_for_object` sondea `get` hasta que
  // el objeto exista o venza `expires_at_unix_ms`; sin él lo pide una vez.
  rpc StartImport(StartImportRequest) returns (StartTransferResponse);
  // Exporta `path` tal como está ahora (se abre y se mide al aceptar la
  // petición): un PUT o las partes de una subida multiparte.
  rpc StartExport(StartExportRequest) returns (StartTransferResponse);
  rpc GetTransfer(GetTransferRequest) returns (TransferState);
  // Primero el estado actual; después una foto completa en cada cambio;
  // termina tras DONE, FAILED o CANCELLED.
  rpc WatchTransfer(WatchTransferRequest) returns (stream TransferEvent);
  rpc CancelTransfer(CancelTransferRequest) returns (CancelTransferResponse);
}

message ReadRequest {
  string path = 1;
  optional User user = 2;
}
message ReadResponse {
  bytes chunk = 1;
}

message WriteRequest {
  // Presente en el primer mensaje de cada fichero.
  optional string path = 1;
  optional User user = 2;
  optional uint32 mode = 3;
  bytes chunk = 4;
  // Sólo en el primer mensaje de cada fichero (el que lleva `path`):
  // sustituye el conjunto entero de metadatos del fichero. Claves: caracteres
  // token de HTTP, se guardan en minúsculas; valores: ASCII imprimible; como
  // máximo 64 claves y 4000 bytes contando `user.rayito.` + clave + valor.
  map<string, string> metadata = 5;
}
message WriteResponse {
  // Una entrada por fichero escrito, en orden.
  repeated EntryInfo entries = 1;
}

message StatRequest {
  string path = 1;
  optional User user = 2;
}
message StatResponse {
  EntryInfo entry = 1;
}

message ListDirRequest {
  string path = 1;
  // 1 = sólo el directorio. >1 desciende. 0 se interpreta como 1.
  uint32 depth = 2;
  optional User user = 3;
}
message ListDirResponse {
  repeated EntryInfo entries = 1;
}

message MakeDirRequest {
  string path = 1;
  optional User user = 2;
}
message MakeDirResponse {
  EntryInfo entry = 1;
}

message MoveRequest {
  string source = 1;
  string destination = 2;
  optional User user = 3;
}
message MoveResponse {
  EntryInfo entry = 1;
}

message RemoveRequest {
  string path = 1;
  bool recursive = 2;
  optional User user = 3;
}
message RemoveResponse {}

message WatchDirRequest {
  string path = 1;
  bool recursive = 2;
  optional User user = 3;
  // Si es true, FilesystemEvent.entry se rellena en CREATE/WRITE/CHMOD.
  bool include_entry = 4;
}

message WatchDirResponse {
  oneof event {
    WatchStarted started = 1;
    FilesystemEvent filesystem = 2;
    KeepAlive keepalive = 3;
  }
}

message WatchStarted {}

enum FilesystemEventType {
  FILESYSTEM_EVENT_TYPE_UNSPECIFIED = 0;
  FILESYSTEM_EVENT_TYPE_CREATE = 1;
  FILESYSTEM_EVENT_TYPE_WRITE = 2;
  FILESYSTEM_EVENT_TYPE_REMOVE = 3;
  FILESYSTEM_EVENT_TYPE_RENAME = 4;
  FILESYSTEM_EVENT_TYPE_CHMOD = 5;
}

message FilesystemEvent {
  // Relativo al directorio observado.
  string name = 1;
  FilesystemEventType type = 2;
  optional EntryInfo entry = 3;
}

message S3Location {
  string bucket = 1;
  // Prefijo de clave sin `/` inicial ni final; rayd añade
  // `/home.tar.gz` y `/manifest.json`.
  string key_prefix = 2;
  // Región del bucket; ausente = AWS_REGION del MicroVM.
  optional string region = 3;
}

message CheckpointRequest {
  S3Location target = 1;
  optional User user = 2;
  // Rutas relativas al HOME (sin `..`, sin `/` inicial), máx. 64.
  repeated string exclude = 3;
}
message CheckpointEvent {
  oneof event {
    CheckpointStarted started = 1;
    CheckpointProgress progress = 2;
    CheckpointDone done = 3;
    StreamError error = 4;
    KeepAlive keepalive = 5;
  }
}
message CheckpointStarted {
  // Entradas que se van a archivar (ficheros + dirs + symlinks).
  uint64 files = 1;
  // Suma de tamaños de los ficheros regulares.
  uint64 bytes = 2;
}
message CheckpointProgress {
  uint64 files_done = 1;
  uint64 bytes_read = 2;
  uint64 bytes_uploaded = 3;
}
message CheckpointDone {
  uint64 files = 1;
  uint64 bytes_read = 2;
  // Tamaño del tar.gz subido.
  uint64 archive_bytes = 3;
  // Hex del sha256 del tar.gz.
  string sha256 = 4;
  // No legibles + tipos no soportados.
  uint64 skipped = 5;
  uint32 duration_ms = 6;
}

message RestoreRequest {
  S3Location source = 1;
  optional User user = 2;
}
message RestoreEvent {
  oneof event {
    RestoreStarted started = 1;
    RestoreProgress progress = 2;
    RestoreDone done = 3;
    StreamError error = 4;
    KeepAlive keepalive = 5;
  }
}
message RestoreStarted {
  // Del manifest.
  uint64 archive_bytes = 1;
  // Del manifest.
  uint64 files = 2;
}
message RestoreProgress {
  uint64 files_done = 1;
  uint64 bytes_downloaded = 2;
}
message RestoreDone {
  uint64 files = 1;
  uint64 bytes_written = 2;
  uint64 archive_bytes = 3;
  string sha256 = 4;
  uint64 skipped = 5;
  uint32 duration_ms = 6;
}

message S3Object {
  // Nombre DNS sin puntos.
  string bucket = 1;
  string key = 2;
  string region = 3;
}

message PresignedRequest {
  // Nunca se registra en logs.
  string url = 1;
  // Cabeceras firmadas que rayd envía tal cual; hoy sólo `content-type`.
  map<string, string> headers = 2;
}

message PresignedMultipart {
  uint64 part_size = 1;
  // Una URL de UploadPart por parte, en orden (PartNumber 1..N).
  repeated PresignedRequest parts = 2;
}

message StartImportRequest {
  string path = 1;
  optional User user = 2;
  optional uint32 mode = 3;
  S3Object object = 4;
  PresignedRequest get = 5;
  optional PresignedRequest delete = 6;
  bool wait_for_object = 7;
  int64 expires_at_unix_ms = 8;
  // 0 = sin tope propio (sigue valiendo la reserva de disco).
  uint64 max_bytes = 9;
  // Hex en minúsculas; vacío = no se comprueba.
  string expected_sha256 = 10;
  // Mismas reglas que WriteRequest.metadata.
  map<string, string> metadata = 11;
}

message StartExportRequest {
  string path = 1;
  optional User user = 2;
  S3Object object = 3;
  oneof target {
    PresignedRequest put = 4;
    PresignedMultipart multipart = 5;
  }
  int64 expires_at_unix_ms = 6;
}

message StartTransferResponse {
  string transfer_id = 1;
}

message GetTransferRequest {
  string transfer_id = 1;
}

message WatchTransferRequest {
  string transfer_id = 1;
}

message CancelTransferRequest {
  string transfer_id = 1;
}

message CancelTransferResponse {}

enum TransferDirection {
  TRANSFER_DIRECTION_UNSPECIFIED = 0;
  TRANSFER_DIRECTION_IMPORT = 1;
  TRANSFER_DIRECTION_EXPORT = 2;
}

enum TransferPhase {
  TRANSFER_PHASE_UNSPECIFIED = 0;
  TRANSFER_PHASE_WAITING = 1;
  TRANSFER_PHASE_RUNNING = 2;
  TRANSFER_PHASE_DONE = 3;
  TRANSFER_PHASE_FAILED = 4;
  TRANSFER_PHASE_CANCELLED = 5;
}

message TransferState {
  string transfer_id = 1;
  TransferDirection direction = 2;
  TransferPhase phase = 3;
  uint64 bytes_done = 4;
  uint64 bytes_total = 5;
  // Sondeos del GET hechos por una importación.
  uint32 probes = 6;
  // Importación: el fichero escrito; exportación: el origen al aceptarla.
  optional EntryInfo entry = 7;
  // Hex del sha256 de los bytes transferidos (en DONE).
  string sha256 = 8;
  // ETag de cada parte, en orden (exportación multiparte en DONE).
  repeated string part_etags = 9;
  uint32 duration_ms = 10;
  optional StreamError error = 11;
}

message TransferEvent {
  oneof event {
    TransferState state = 1;
    KeepAlive keepalive = 2;
  }
}
