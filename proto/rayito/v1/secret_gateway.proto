syntax = "proto3";

package rayito.v1;

// Owned by m15-secrets-gateway. Message names stay prefixed
// (`SecretGateway*`) so they never collide with another feature's messages
// inside `rayito.v1`.
//
// Semantics: a present `SecretGatewayConfig` is the gateway's complete
// desired state and replaces whatever routes were configured before (an
// empty message tears every route down, closing its listener). Header
// values are the only place a secret's actual bytes cross the wire to
// `rayd`: the SDK resolves each configured header from Secrets Manager
// (through the same `SecretCache` `secrets=` already uses) right before
// building this message, and `rayd` keeps the value only in memory
// (`SecretValue`, `Zeroizing`, never logged, never `Debug`-printed —
// `ConfigureGrpc` never logs its request for exactly this reason).
//
// A route whose `name` repeats one the previous `Configure` call sent keeps
// its listener and its port: only its headers, allow rules and rate swap,
// and the very next request on any connection — including a keep-alive
// connection opened before the call — already sees them. That is what lets
// the SDK's `refresh()` rotate a secret without breaking a process started
// with `http://127.0.0.1:<port>`. A name missing from a new call tears that
// route down: its listener stops accepting, an idle keep-alive connection
// is closed and an in-flight request may finish, so no connection keeps
// forwarding with the removed route's credential.
//
// Refused with `SECTION_CODE_INVALID` before any listener changes (closed
// lowercase-snake `error_class`, `rayd_core::secret_gateway::GatewaySpecError`):
// a route name outside `[a-z0-9-]` (`invalid_route_name`); a header name that
// is not an RFC 9110 token or names a hop-by-hop or framing header (`host`,
// `content-length`, `transfer-encoding`, `connection`, ...;
// `invalid_header_name`); two header names equal ignoring case
// (`duplicate_header_name`); an upstream with userinfo or a fragment
// (`invalid_upstream_host`); an `allow` path no request could match because
// the listener refuses every request that would (`invalid_allow_path`, the
// same rule as for request paths below).
message SecretGatewayConfig {
  repeated SecretGatewayRoute routes = 1;
}

// One loopback HTTP listener: `rayd` accepts on `127.0.0.1:<ephemeral>`,
// refuses (403 `not_allowed`) any request path outside an allowlist: every
// raw byte must be an RFC 3986 path character other than `;` (unreserved,
// `:`, `@`, the other sub-delims, or a well-formed `%XX`), no segment may be
// empty except the last, and each segment, percent-decoded exactly once,
// must be valid UTF-8 with no control byte, no `/`, `\`, `%` or `;`, and must
// not be `.` or `..` — it never normalises a path, so it never forwards one
// an upstream could normalise, strip of a `;` parameter or decode a second
// time past `allow` — checks `allow` and the rate limit
// before touching the network, strips
// any inbound header `headers` also names (so the sandbox can never spoof
// or read back its own gateway's credential) and injects the vaulted
// values, then forwards to `upstream` over TLS as root — the one
// declared, named exception to the guest's egress policy this feature
// opens (`RootEgressClass::SecretGatewayUpstream`, ADR-012).
message SecretGatewayRoute {
  // 1-64 lowercase `[a-z0-9-]`; keys `SecretGatewayStatus.routes` and is
  // never itself secret.
  string name = 1;
  // `https://` only; no path, query or fragment (those come from each
  // forwarded request). Never echoed in an error.
  string upstream = 2;
  // Header name -> the value to inject, resolved by the SDK before this
  // call. At most `MAX_HEADERS_PER_ROUTE` (rayd_core::secret_gateway::route);
  // names are matched and injected lower-cased.
  map<string, string> headers = 3;
  repeated SecretGatewayAllowRule allow = 4;
  // Token-bucket capacity per full minute; `0` means "use the domain's
  // default" (`rayd_core::secret_gateway::route::DEFAULT_RATE_PER_MINUTE`).
  uint32 rate_per_minute = 5;
}

message SecretGatewayAllowRule {
  // `GET`, `POST`, ... (uppercase, no wildcard: a route that allows every
  // method lists each one it needs).
  string method = 1;
  // An exact path ("/v1/messages") or a prefix ending in the literal
  // wildcard suffix "/*" (rayd_core::secret_gateway::route::WILDCARD_SUFFIX).
  string path = 2;
}

message SecretGatewayStatus {
  repeated SecretGatewayRouteStatus routes = 1;
}

message SecretGatewayRouteStatus {
  string name = 1;
  // The real loopback port this route's listener bound (0 while the
  // listener is still starting up, never repeated across routes).
  uint32 port = 2;
  SecretGatewayRouteState state = 3;
  // Lowercase snake `rayd_core::secret_gateway::GatewayErrorClass`, set only
  // once a request against this route actually failed; empty otherwise.
  string last_error_class = 4;
}

enum SecretGatewayRouteState {
  SECRET_GATEWAY_ROUTE_STATE_UNSPECIFIED = 0;
  SECRET_GATEWAY_ROUTE_STATE_LISTENING = 1;
  SECRET_GATEWAY_ROUTE_STATE_FAILED = 2;
}
