# Entorno local de pruebas punta a punta (docs/site/docs/guias/probar-en-local.md):
#
#   floci   emulador de AWS (S3, DynamoDB, Secrets Manager, CloudFormation, el
#           plano de control de Lambda MicroVMs...) en la red interna `aws`.
#   runner  las toolchains de los SDK; es el dueño del espacio de red que
#           comparte con el guest, así los SDK hablan con rayd por loopback.
#   guest   la imagen de producto (image/Dockerfile) con rayd como PID 1,
#           haciendo de MicroVM: sus hooks (/ready, /run, /suspend, /resume,
#           /terminate) los llama el plano de control local de los tests.
#
# Se levanta con `make local-up` (que prepara antes el contexto del guest en
# dev/local/.guest-context) y se baja con `make local-down`. Nada escucha en
# el host: ningún servicio publica puertos. Ningún contenedor es privilegiado
# ni monta el socket de Docker, y ninguna imagen lleva secretos: las
# credenciales de AWS son los valores ficticios que Floci acepta.
name: rayito-local

x-aws-env: &aws-env
  AWS_ENDPOINT_URL: http://floci:4566
  AWS_REGION: ${RAYITO_LOCAL_REGION:-us-east-1}
  AWS_DEFAULT_REGION: ${RAYITO_LOCAL_REGION:-us-east-1}
  # Floci acepta cualquier par no vacío; `test` no es un secreto y lo
  # asigna a la cuenta 000000000000 (FLOCI_DEFAULT_ACCOUNT_ID).
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test

services:
  floci:
    # Floci 2.1.0 (MIT), fijado por el digest de la manifest list (amd64 y
    # arm64) consultado el 2026-10-04. 2.1.0 corrige GHSA-6f92-9q2p-fmpj
    # (RCE en el host por un bind mount de ECS con el socket de Docker) y
    # GHSA-x7jw-8w9c-q4rq; la decisión de confianza está en
    # docs/research/2026-10-local-testing.md.
    image: floci/floci:2.1.0@sha256:f5aa8c18302cedb4f2385f5c4e455b3efc77fee6bf7b6e5d1712b2817ba102db
    # Arranca directamente como su usuario sin privilegios (el entrypoint
    # solo usa root para leer el grupo del socket de Docker, que aquí no hay).
    user: "1001:0"
    read_only: true
    tmpfs:
      - /tmp
      - /app/data:uid=1001,gid=0,mode=0770
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 512
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: ${RAYITO_LOCAL_REGION:-us-east-1}
      FLOCI_STORAGE_MODE: memory
      # Sin socket de Docker los servicios con contenedores no pueden correr;
      # se apagan para que tampoco escuchen (la consola web, el IMDS de EC2 en
      # el 9169, el broker MQTT de IoT).
      FLOCI_SERVICES_UI_ENABLED: "false"
      FLOCI_SERVICES_EC2_ENABLED: "false"
      FLOCI_SERVICES_ECS_ENABLED: "false"
      FLOCI_SERVICES_EKS_ENABLED: "false"
      FLOCI_SERVICES_ECR_ENABLED: "false"
      FLOCI_SERVICES_RDS_ENABLED: "false"
      FLOCI_SERVICES_RDS_DATA_ENABLED: "false"
      FLOCI_SERVICES_ELASTICACHE_ENABLED: "false"
      FLOCI_SERVICES_MSK_ENABLED: "false"
      FLOCI_SERVICES_AMAZONMQ_ENABLED: "false"
      FLOCI_SERVICES_OPENSEARCH_ENABLED: "false"
      FLOCI_SERVICES_KINESIS_ANALYTICS_ENABLED: "false"
      FLOCI_SERVICES_CODEBUILD_ENABLED: "false"
      FLOCI_SERVICES_IOT_ENABLED: "false"
      FLOCI_SERVICES_IOT_MQTT_ENABLED: "false"
    networks:
      aws:
        # El SDK v3 de JavaScript direcciona S3 por host virtual
        # (`<bucket>.floci`): un alias por bucket que usan los tests basta,
        # sin tocar `forcePathStyle` en el SDK.
        aliases:
          - rayito-local-artifacts.floci

  runner:
    build:
      context: runner
    image: rayito-local-runner:dev
    init: true
    read_only: true
    tmpfs:
      - /tmp
      # El uid del usuario `runner` (`RUNNER_UID` en runner/Dockerfile),
      # fuera del rango del sandbox para que rayd acepte sus hooks.
      - /home/runner:uid=993,gid=993
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 1024
    environment:
      <<: *aws-env
      # Dónde escucha el guest dentro del espacio de red compartido:
      # `host:puerto gRPC:puerto de hooks` (los tests lo leen y, sin esta
      # variable, el entorno local no se activa).
      RAYITO_LOCAL_GUEST: 127.0.0.1:8080:9000
      RAYITO_LOCAL_ARTIFACT_BUCKET: rayito-local-artifacts
      # Dónde deja `make local-bedrock-key` la clave de Bedrock de corta
      # duración y la leen los tests `local` de agentes: el tmpfs de /tmp,
      # que muere con el contenedor. Sin el fichero esos tests se saltan.
      RAYITO_LOCAL_BEDROCK_KEY_FILE: /tmp/rayito-local-bedrock-key
      # Modelo y región de esos tests (vacío: Claude Haiku 4.5, us-east-1).
      RAYITO_E2E_BEDROCK_MODEL: ${RAYITO_E2E_BEDROCK_MODEL:-}
      RAYITO_E2E_BEDROCK_REGION: ${RAYITO_E2E_BEDROCK_REGION:-}
    volumes:
      - ../..:/src:ro
      - venv:/opt/rayito/venv
      - cache:/opt/rayito/cache
      - node-modules:/src/clients/typescript/node_modules
    networks: [aws, egress]

  guest:
    build:
      context: .guest-context
    image: rayito-local-guest:dev
    network_mode: service:runner
    depends_on: [runner]
    # `/terminate` hace salir a rayd, como en un MicroVM: Docker lo vuelve a
    # arrancar y el siguiente `run_microvm` encuentra un rayd nuevo (la capa
    # de escritura del contenedor sí sobrevive entre sandboxes).
    restart: always
    command: ["/usr/local/bin/rayd", "--grpc-port", "8080", "--hooks-port", "9000"]
    # rayd corre como root para hacer setuid/setfsuid a `user` (uid 1000) y
    # preparar /run/rayito/k, igual que en la imagen real; se quitan las
    # capabilities por defecto de Docker que no necesita. Sin CAP_NET_ADMIN
    # el bloqueo de IMDS y el egress se registran y siguen (fail-open, como
    # rayito-base sin `-caps`); sin CAP_SYS_ADMIN no hay montajes S3.
    cap_drop: [NET_RAW, MKNOD, AUDIT_WRITE, SYS_CHROOT, SETFCAP, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    pids_limit: 2048
    environment:
      AWS_REGION: ${RAYITO_LOCAL_REGION:-us-east-1}

networks:
  # Floci solo vive aquí: sin salida a Internet ni puertos en el host.
  aws:
    internal: true
  # Salida para que el runner instale dependencias (uv, pnpm).
  egress: {}

volumes:
  venv: {}
  cache: {}
  node-modules: {}
