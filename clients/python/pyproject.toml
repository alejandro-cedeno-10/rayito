[project]
name = "rayito"
version = "0.15.0"
description = "Sandboxes de ejecución para agentes de IA sobre AWS Lambda MicroVMs, en tu propia cuenta, y despliegue de agentes en MicroVMs o en Amazon Bedrock AgentCore, con la CLI o con CDK."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "grpcio>=1.84,<2",
    "protobuf>=7.36.1,<8",
    "boto3>=1.43.82,<2",
]
keywords = ["sandbox", "e2b", "aws", "lambda", "microvm", "firecracker", "agents", "code-interpreter", "bedrock", "agentcore", "aws-cdk", "cdk", "agent-deployment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
cli = ["typer>=0.15,<1"]
mcp = ["mcp>=2.2,<3"]
otel = ["opentelemetry-api>=1.27,<2"]
# SigV4A para el plano de datos de `cloudfront-keyvaluestore`
# (`CustomDomain.register`/`unregister`/`refresh`, m15-custom-domain):
# endpoint-rule-set-1.json de ese servicio exige ese firmante, que boto3
# sólo sabe usar con `awscrt` instalado (AWS_API_NOTES.md §29).
custom-domain = ["awscrt>=0.23,<1"]
# Constructos CDK `rayito.cdk` (`RayitoAgent`, `RayitoMicrovmImage`,
# agentcore-cdk, ADR-032): `CfnMicrovmImage` aparece en aws-cdk-lib 2.261.0
# (AWS_API_NOTES.md Q184). La síntesis en Python necesita Node (jsii).
cdk = ["aws-cdk-lib>=2.261.0,<3", "constructs>=10.5.0,<11"]

[project.scripts]
rayito = "rayito.cli.__main__:main"
rayito-mcp = "rayito.mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/alejandro-cedeno-10/rayito"
Repository = "https://github.com/alejandro-cedeno-10/rayito"
Documentation = "https://alejandro-cedeno-10.github.io/rayito/"
Changelog = "https://github.com/alejandro-cedeno-10/rayito/blob/main/clients/python/CHANGELOG.md"
Issues = "https://github.com/alejandro-cedeno-10/rayito/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.12",
    "mypy>=1.14",
    "types-protobuf>=6.30",
    "grpc-stubs>=1.53",
    "typer>=0.15,<1",
    "rayito[mcp]",
    "rayito[otel]",
    "rayito[custom-domain]",
    "rayito[cdk]",
    "opentelemetry-sdk>=1.27,<2",
    # scripts/tests/test_iam_template.py parsea infra/iam.yaml (CI corre
    # scripts/tests con este entorno).
    "pyyaml>=6.0",
    # Los tests de contrato del panel validan cada respuesta de /api/v1
    # contra testdata/dashboard/api-v1.schema.json.
    "jsonschema>=4.23",
]
docs = [
    "mkdocs-material>=9.6",
    "mkdocstrings[python]>=0.27",
    # Exacta: el sitio bilingüe (es por defecto, en) depende de su sufijo
    # `pagina.en.md`; una subida pasa por Dependabot y por `make docs`.
    "mkdocs-static-i18n==1.3.1",
]

[build-system]
requires = ["uv_build>=0.7.19,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/rayito/v1"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "T20"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"src/rayito/cli/**" = ["T20"]
"src/rayito/_agent/_detection_rules.py" = ["E501"]
"src/rayito/_limits.py" = ["E501"]
"src/rayito/mcp/__main__.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["rayito"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: corre contra AWS real (requiere RAYITO_E2E=1 y RAYITO_TEMPLATE); excluido por defecto",
    "bench: benchmarks nightly, excluidos por defecto",
    "slow: e2e de más de una hora (RAYITO_E2E_SLOW=1), excluidos por defecto",
    "local: e2e contra el guest y Floci de dev/local (make local-e2e); excluido por defecto",
    "docker_export: construye y prueba el contenedor que exporta AgentProject con el Docker del host (make agent-export-test); excluido por defecto",
]
addopts = "-m 'not e2e and not bench and not slow and not local and not docker_export'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]
exclude = ["src/rayito/v1/"]

[[tool.mypy.overrides]]
module = ["rayito.v1.*"]
ignore_errors = true
follow_imports = "skip"

# Los fakes de test heredan de los servicers generados (sin tipos): la única
# relajación de `strict`, acotada a esos módulos.
[[tool.mypy.overrides]]
module = [
    "tests.unit.conftest",
    "tests.unit.fake_process",
    "tests.unit.fake_filesystem",
    "tests.unit.fake_code",
    "tests.unit.fake_pty",
    "tests.unit.fake_lifecycle",
]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
