AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Rayito M15 sizes-catalog (optional): an IAM managed policy that caps
  lambda:RunMicrovm to the specific image ARNs a `rayito image publish
  --sizes` run produced (Q90, docs/research/2026-10-e2b-out-of-scope.md): a
  cost guard against launching a size larger than intended. The cap is a
  Deny on every ARN *not* in the list, so it works whatever other policy is
  already attached to the identity (including the standard CallerPolicy of
  infra/iam.yaml, which grants lambda:RunMicrovm on microvm-image:* and
  would otherwise make an Allow-only version of this policy a no-op: IAM
  evaluates an explicit Deny before any Allow, from any policy, Resource
  being the only input it can see). IAM-only: no billable resource, $0 at
  idle and per use. Action names and parameters: AWS_API_NOTES.md section
  24. Deploy it only if you publish more than the baseline size and want to
  cap which image ARNs a caller may run; delete the stack to remove the
  policy (it never deletes an image).

Parameters:
  ImageArns:
    Type: CommaDelimitedList
    Description: >-
      The image ARN (without a version) of every image this policy allows
      lambda:RunMicrovm on (the baseline plus every --sizes suffix you
      published, e.g. rayito-base, rayito-base-512mb and
      rayito-base-4gb). lambda:RunMicrovm authorizes against the
      unversioned image ARN (Q90, AWS_API_NOTES.md section 24): pass each
      value exactly as `rayito image list` prints `imageArn`, never with a
      trailing version segment — a version-qualified ARN would make the
      Deny statement below match (and so deny) every launch for the
      identity. A bare name is not a valid Resource for an IAM policy
      either.

Resources:
  RayitoRunAllowedSizes:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: >-
        Rayito sizes-catalog cost guard: an explicit Deny on
        lambda:RunMicrovm for every image ARN outside the listed set
        overrides any Allow the identity already has (e.g. the standard
        CallerPolicy's microvm-image:* grant), so a caller with this
        policy attached cannot launch a size this account did not
        explicitly publish and allow, regardless of what else it can do.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: RunAllowedSizeImages
            Effect: Allow
            Action:
              - lambda:RunMicrovm
            Resource: !Ref ImageArns
          - Sid: DenyRunMicrovmOutsideAllowedSizes
            Effect: Deny
            Action:
              - lambda:RunMicrovm
            NotResource: !Ref ImageArns

Outputs:
  PolicyArn:
    Description: >-
      Attach to the identity that creates sandboxes: the Deny statement
      makes this effective no matter what other lambda:RunMicrovm grant
      that identity also carries.
    Value: !Ref RayitoRunAllowedSizes
