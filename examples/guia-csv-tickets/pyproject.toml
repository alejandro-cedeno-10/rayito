[project]
name = "rayito-tickets-ejemplos"
version = "0.1.0"
description = "Ejemplos reproducibles del tutorial: sandbox, CSV de tickets, template, pool y agente con Rayito 0.15.0"
requires-python = ">=3.11"
dependencies = [
    "rayito[cli]==0.15.0",
    # sólo para 08_crear_secreto.py: genera una clave de Bedrock de corta duración
    "aws-bedrock-token-generator==1.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["_comun", "verificar"]
