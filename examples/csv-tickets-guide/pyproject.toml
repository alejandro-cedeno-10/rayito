[project]
name = "csv-tickets-guide"
version = "0.1.0"
description = "Lab for the tickets CSV guide: sandbox, template, pool and agent with Rayito 0.15.0"
requires-python = ">=3.11"
dependencies = [
    "rayito[cli]==0.15.0",
    # only for 08_create_secret.py --generate: signs a short-lived Bedrock key
    "aws-bedrock-token-generator==1.1.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "boto3-stubs[secretsmanager]==1.43.118",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["_common", "verify"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = ["python", "contract"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pandas", "tabulate", "aws_bedrock_token_generator"]
ignore_missing_imports = true
